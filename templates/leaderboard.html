<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Assessment Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6fc;
        }
        
        .navbar {
            background: linear-gradient(135deg, #1a237e 0%, #3949ab 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
        }
        
        .navbar a:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .leaderboard-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .leaderboard-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .leaderboard-header h1 {
            color: #1a237e;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        th {
            background: #f5f5f5;
            color: #1a237e;
            font-weight: 600;
        }
        
        .rank-1 {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
            font-weight: bold;
        }
        
        .rank-2 {
            background: #C0C0C0;
            color: white;
            font-weight: bold;
        }
        
        .rank-3 {
            background: #CD7F32;
            color: white;
            font-weight: bold;
        }
        
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #1a237e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
        }
        
        .back-btn:hover {
            background: #3949ab;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('quiz') }}">Quiz</a>
        <a href="{{ url_for('leaderboard') }}">Leaderboard</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
    
    <div class="container">
        <div class="leaderboard-card">
            <div class="leaderboard-header">
                <h1>🏆 Top 10 Students</h1>
                <p>Highest scores leaderboard</p>
            </div>
            
            <div id="leaderboard-content">
                <p>Loading leaderboard...</p>
            </div>
            
            <a href="{{ url_for('quiz') }}" class="back-btn">← Back to Quiz</a>
        </div>
    </div>
    
    <script>
        async function loadLeaderboard() {
            try {
                const response = await fetch('/leaderboard', {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                const data = await response.json();
                
                let html = '<table><thead><tr><th>Rank</th><th>Name</th><th>Class</th><th>Best Score</th><th>Attempts</th></tr></thead><tbody>';
                
                data.forEach((student, index) => {
                    let rankClass = '';
                    if (index === 0) rankClass = 'rank-1';
                    else if (index === 1) rankClass = 'rank-2';
                    else if (index === 2) rankClass = 'rank-3';
                    
                    html += `<tr class="${rankClass}">
                        <td><strong>#${index + 1}</strong></td>
                        <td>${student.name}</td>
                        <td>${student.class || 'Not specified'}</td>
                        <td><strong>${student.best_pct}%</strong></td>
                        <td>${student.attempts}</td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('leaderboard-content').innerHTML = html;
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                document.getElementById('leaderboard-content').innerHTML = '<p>Error loading leaderboard. Please try again.</p>';
            }
        }
        
        loadLeaderboard();
    </script>
</body>
</html>
