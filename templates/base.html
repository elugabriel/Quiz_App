<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CompuQuiz{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">⚡ CompuQuiz</a>
    <div class="nav-right">
      {% if session.student_name %}
        <span class="student-tag">{{ session.student_name }}</span>
        <a href="{{ url_for('logout') }}" class="nav-logout">Logout</a>
      {% endif %}
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <script src="{{ url_for('static', filename='js/drag_quiz.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
