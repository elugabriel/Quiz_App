{% extends "base.html" %}
{% block title %}Login — CompuQuiz{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-card">
    <div class="login-icon">🖥️</div>
    <h1 class="login-title">CompuQuiz</h1>
    <p class="login-subtitle">Computer Science Interactive Assessment</p>
    <p class="login-subtitle">Secondary School Edition</p>

    {% if error %}
      <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="e.g. Amara Chukwu"
          required
          autocomplete="name"
        >
      </div>

      <!-- <div class="form-group">
        <label for="class_name">Class</label>
        <select id="class_name" name="class_name">
          <option value="">— Select Class —</option>
          <option value="SS1A">SS1A</option>
          <option value="SS1B">SS1B</option>
          <option value="SS2A">SS2A</option>
          <option value="SS2B">SS2B</option>
          <option value="SS3A">SS3A</option>
          <option value="SS3B">SS3B</option>
        </select>
      </div> -->

      <button type="submit" class="btn-login">Start Quiz →</button>
    </form>

    <p class="login-note">
      📋 Answer drag-and-drop questions.<br>
      Pass mark: 50%
    </p>
  </div>
</div>
{% endblock %}
